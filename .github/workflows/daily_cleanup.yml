name: Daily Email Cleanup

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: |
          echo "USE_IMAP=true" > .env
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
          echo "EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}" >> .env
          echo "TELEGRAM_WEBHOOK=${{ secrets.TELEGRAM_WEBHOOK }}" >> .env
          echo "DAYS_THRESHOLD=${{ secrets.DAYS_THRESHOLD || '3' }}" >> .env
          echo "DIGEST_TIME=08:00" >> .env
          echo "TIMEZONE=UTC" >> .env
          echo "GITHUB_API_TOKEN=${{ github.token }}" >> .env
          echo "GITHUB_REPO=omh943/email-bot" >> .env

      # Persistir los IDs ya notificados entre ejecuciones para no repetir correos.
      # Cada run restaura el cache más reciente y guarda uno nuevo con los IDs actualizados.
      - name: Restaurar IDs procesados
        uses: actions/cache@v6
        with:
          path: data/processed_ids.json
          key: processed-ids-${{ github.run_id }}
          restore-keys: |
            processed-ids-

      - run: python -m src.main

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cleanup-logs
          path: logs/
          retention-days: 7

      # Subir la BD del chatbot para que el VPS del Telegram pueda descargarla
      # y conocer los análisis previos del bot de correo.
      - name: Subir BD del chatbot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-bot-db
          path: data/telegram_bot.db
          retention-days: 7
          overwrite: true

      # Commit automático del dataset y processed_ids al repositorio
      # para memoria persistente sin base de datos externa.
      # Requiere el secreto DATA_PUSH_TOKEN (PAT con scope repo). Si no existe,
      # solo sube el dataset como artifact para el chatbot.
      - name: Commit dataset y processed_ids
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/dataset.json data/processed_ids.json
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git commit -m "chore: actualizar dataset de correos y processed_ids [skip ci]"
            if [ -n "${DATA_PUSH_TOKEN}" ]; then
              git remote set-url origin "https://x-access-token:${DATA_PUSH_TOKEN}@github.com/omh943/email-bot.git"
              git push origin main
            else
              echo "No hay DATA_PUSH_TOKEN: commit local solo, dataset se sube como artifact"
            fi
          else
            echo "Sin cambios que commitear"
          fi
        env:
          DATA_PUSH_TOKEN: ${{ secrets.DATA_PUSH_TOKEN }}

      # Subir dataset.json como artifact para el chatbot en la nube
      # (si no hay DATA_PUSH_TOKEN, el chatbot lo descarga desde aquí)
      - name: Subir dataset.json como artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dataset-json
          path: data/dataset.json
          retention-days: 7
          overwrite: true
