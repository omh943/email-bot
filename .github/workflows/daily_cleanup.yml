name: Daily Email Cleanup

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: |
          echo "USE_IMAP=true" > .env
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
          echo "EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}" >> .env
          echo "TELEGRAM_WEBHOOK=${{ secrets.TELEGRAM_WEBHOOK }}" >> .env
          echo "DAYS_THRESHOLD=${{ secrets.DAYS_THRESHOLD || '3' }}" >> .env
          echo "DIGEST_TIME=08:00" >> .env
          echo "TIMEZONE=UTC" >> .env

      - run: python -m src.main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-logs
          path: logs/
          retention-days: 7
