name: Daily Email Cleanup

on:
  schedule:
    # Ejecuta todos los días a las 8:00 AM UTC (ajusta según tu zona horaria)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" > .env
          echo "EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}" >> .env
          echo "TELEGRAM_WEBHOOK=${{ secrets.TELEGRAM_WEBHOOK }}" >> .env
          echo "GMAIL_CREDENTIALS_JSON=${{ secrets.GMAIL_CREDENTIALS_JSON }}" >> .env
          echo "GMAIL_TOKEN_JSON=${{ secrets.GMAIL_TOKEN_JSON }}" >> .env
          echo "DAYS_THRESHOLD=${{ secrets.DAYS_THRESHOLD || '3' }}" >> .env
          echo "DIGEST_TIME=08:00" >> .env
          echo "TIMEZONE=UTC" >> .env

      - name: Run email cleaner
        run: |
          python -m src.main

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs
          path: logs/
          retention-days: 7